# Deploy to Azure after images are published from main. Only main deploys.
# A deploy runs only when the `ci` checks also passed for the same commit
# (ADR-009), and it names the commit SHA image, so a rollback is a redeploy.
#
# Needs one repository secret, AZURE_CREDENTIALS: the JSON that
# `az ad sp create-for-rbac --sdk-auth` prints (or the course's principal).
name: cd

on:
  workflow_run:
    workflows: [images]
    types: [completed]
    branches: [main]

permissions:
  contents: read

env:
  RESOURCE_GROUP: rg-sdd-3b
  ENVIRONMENT: gamsoulas-ieu2024-env
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Require ci to have passed for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci --commit "$SHA" \
            --json conclusion --jq '.[0].conclusion')
          if [ "$conclusion" != "success" ]; then
            echo "ci for $SHA is '$conclusion', not success. Not deploying."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install the containerapp extension
        run: az extension add -n containerapp --upgrade -y -o none

      - name: Point both services at the new image
        run: |
          for svc in spots sessions; do
            az containerapp update -g "$RESOURCE_GROUP" -n "gamsoulas-ieu2024-$svc" \
              --image "$REGISTRY/swellsync-$svc:$SHA" --set-env-vars "APP_VERSION=$SHA" -o none
          done

      - name: Health check, both services
        run: |
          for svc in spots sessions; do
            fqdn=$(az containerapp show -g "$RESOURCE_GROUP" -n "gamsoulas-ieu2024-$svc" \
              --query properties.configuration.ingress.fqdn -o tsv)
            for attempt in 1 2 3 4 5 6; do
              code=$(curl -s -o /tmp/health.json -w "%{http_code}" "https://$fqdn/health" || true)
              if [ "$code" = "200" ] && grep -q "$SHA" /tmp/health.json; then
                echo "$svc healthy at $SHA"
                break
              fi
              echo "$svc attempt $attempt: HTTP $code, waiting for the new revision"
              sleep 20
              if [ "$attempt" = "6" ]; then echo "$svc did not become healthy"; exit 1; fi
            done
          done
