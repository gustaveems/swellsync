# yaml-language-server: $schema=./system.schema.json
# Draft written from the assignment template. Validate against the course's
# system.schema.json once it is in the repo (not yet provided).
student: gamsoulas.ieu2024
prefix: gamsoulas-ieu2024
public_url: https://zealous-field-0a9922d03.3.azurestaticapps.net
ui:
  path: ui
  static_web_app: gamsoulas-ieu2024-ui
  calls: [spots, sessions]
azure:
  resource_group: rg-sdd-3b
  container_apps_environment: gamsoulas-ieu2024-env
  sql_server: gamsoulas-ieu2024-sql
  registry: ghcr.io/gustaveems
services:
  spots:
    description: Spot directory and its ideal conditions.
    path: services/spots
    openapi: services/spots/openapi.yaml
    port_default: 8000
    health: /health
    migrations: services/spots/migrations
    env:
      PORT: { default: 8000, description: Port the service listens on }
      DATABASE_URL: { secret: true, description: Connection string of the spots database }
      SESSIONS_URL: { default: "http://sessions:8000", description: Base URL of the sessions service }
      SESSIONS_TIMEOUT_S: { default: 2, description: Timeout for calls to sessions }
      ALLOWED_ORIGIN: { default: "http://localhost:8080", description: Only origin allowed by CORS (the UI) }
      APP_VERSION: { default: dev, description: Version reported by /health, set to the commit SHA at build }
    calls:
      - service: sessions
        url_env: SESSIONS_URL
        endpoints: ["GET /sessions"]
        timeout_s: 2
        on_failure: Deleting a spot returns 503 and the spot is kept.
    azure:
      container_app: gamsoulas-ieu2024-spots
      sql_database: gamsoulas-ieu2024-spots-db
  sessions:
    description: Logged sessions, each referencing a spot by id.
    path: services/sessions
    openapi: services/sessions/openapi.yaml
    port_default: 8000
    health: /health
    migrations: services/sessions/migrations
    env:
      PORT: { default: 8000, description: Port the service listens on }
      DATABASE_URL: { secret: true, description: Connection string of the sessions database }
      SPOTS_URL: { default: "http://spots:8000", description: Base URL of the spots service }
      SPOTS_TIMEOUT_S: { default: 2, description: Timeout for calls to spots }
      ALLOWED_ORIGIN: { default: "http://localhost:8080", description: Only origin allowed by CORS (the UI) }
      APP_VERSION: { default: dev, description: Version reported by /health, set to the commit SHA at build }
    calls:
      - service: spots
        url_env: SPOTS_URL
        endpoints: ["GET /spots", "GET /spots/{spot_id}"]
        timeout_s: 2
        on_failure: Session lists are returned with spot_name null and a notice; creating or editing a session returns 503 and nothing is stored.
    azure:
      container_app: gamsoulas-ieu2024-sessions
      sql_database: gamsoulas-ieu2024-sessions-db
