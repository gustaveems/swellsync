<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spots · SwellSync</title>
  <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
  <link rel="stylesheet" href="css/style.css">
  <script src="config.js"></script>
  <script src="js/common.js" defer></script>
  <script src="js/spots.js" defer></script>
</head>
<body>
<header class="site-header">
  <nav class="nav container">
    <a class="brand" href="index.html">SwellSync</a>
    <div class="nav-links">
      <a href="index.html">Dashboard</a>
      <a href="spots.html">Spots</a>
      <a href="sessions.html">Sessions</a>
    </div>
  </nav>
</header>
<main class="container">
  <div id="flash"></div>

  <!-- List view (no ?id=) -->
  <div id="list-view">
    <section class="card">
      <div class="card-head"><h1>Spot directory</h1></div>
      <form id="search-form" class="filter-form inline-form">
        <input type="search" name="q" id="q" placeholder="Search name or location">
        <button class="btn btn-secondary btn-small" type="submit">Search</button>
      </form>
      <div class="table-wrap">
        <table class="table">
          <thead><tr><th>Name</th><th>Location</th><th>Ideal wind</th><th>Ideal swell</th></tr></thead>
          <tbody id="spot-rows"><tr><td colspan="4" class="muted">Loading…</td></tr></tbody>
        </table>
      </div>
    </section>

    <section class="card" id="add-spot">
      <h2>Add a spot</h2>
      <form id="spot-form" class="form-grid">
        <label class="field">Name <input name="name" required maxlength="100"></label>
        <label class="field">Location <input name="location" required maxlength="150"></label>
        <label class="field">Ideal wind direction <input name="ideal_wind_dir" maxlength="60"></label>
        <label class="field">Ideal swell (ft) <input name="ideal_swell_ft" inputmode="decimal"></label>
        <div class="field-wide"><button class="btn" type="submit">Add spot</button></div>
      </form>
    </section>
  </div>

  <!-- Detail view (?id=N): spot from the spots service, sessions from the sessions service -->
  <div id="detail-view" hidden>
    <p><a href="spots.html">← All spots</a></p>
    <section class="card">
      <div class="card-head">
        <h1 id="detail-name">Loading…</h1>
        <button class="btn btn-danger btn-small" id="delete-spot" type="button">Delete spot</button>
      </div>
      <p class="muted" id="detail-location"></p>
      <p id="detail-notice" class="muted"></p>
      <div class="stat-grid">
        <div class="stat-card"><span class="stat-value" id="d-count">…</span><span class="stat-label">sessions here</span></div>
        <div class="stat-card"><span class="stat-value" id="d-hours">…</span><span class="stat-label">water time</span></div>
        <div class="stat-card"><span class="stat-value" id="d-rating">…</span><span class="stat-label">average rating</span></div>
      </div>
    </section>

    <section class="card">
      <h2>Edit this spot</h2>
      <form id="edit-spot-form" class="form-grid">
        <label class="field">Name <input name="name" required maxlength="100"></label>
        <label class="field">Location <input name="location" required maxlength="150"></label>
        <label class="field">Ideal wind direction <input name="ideal_wind_dir" maxlength="60"></label>
        <label class="field">Ideal swell (ft) <input name="ideal_swell_ft" inputmode="decimal"></label>
        <div class="field-wide"><button class="btn" type="submit">Save changes</button></div>
      </form>
    </section>

    <section class="card">
      <h2>Ideal sessions here (rated 4+)</h2>
      <div class="table-wrap">
        <table class="table">
          <thead><tr><th>Date</th><th>Duration</th><th>Rating</th><th>Gear</th></tr></thead>
          <tbody id="epic-rows"><tr><td colspan="4" class="muted">Loading…</td></tr></tbody>
        </table>
      </div>
    </section>
  </div>
</main>
<footer class="site-footer">SwellSync · spots service · <span class="muted">own database</span></footer>
</body>
</html>
